function BollywoodWebsite() {
    const [currentPage, setCurrentPage] = useState('home');
    const [darkMode, setDarkMode] = useState(false);
    const [movieSearch, setMovieSearch] = useState('');
    const [starSearch, setStarSearch] = useState('');

    useEffect(() => {
        const saved = localStorage.getItem('bollywood-theme');
        if (saved === 'dark') setDarkMode(true);
    }, []);

    useEffect(() => {
        localStorage.setItem('bollywood-theme', darkMode ? 'dark' : 'light');
    }, [darkMode]);

    const filteredMovies = movies.filter(m => 
        m.title.toLowerCase().includes(movieSearch.toLowerCase())
    );

    const filteredStars = stars.filter(s => 
        s.name.toLowerCase().includes(starSearch.toLowerCase())
    );

    const navItems = [
        { id: 'home', label: 'Etusivu' },
        { id: 'movies', label: 'Elokuvat' },
        { id: 'stars', label: 'Tähdet' },
        { id: 'directors', label: 'Ohjaajat' },
        { id: 'music', label: 'Musiikki' },
    ];

    return (
        <div className={`min-h-screen transition-colors duration-300 ${darkMode ? 'bg-[#0f1113] text-[#e6eef6]' : 'bg-[#f4f4f4] text-[#222]'}`}>
            {/* Skip Link */}
            <a href="#main" className="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 focus:z-50 focus:bg-[#b30000] focus:text-white focus:px-4 focus:py-2 focus:rounded-lg">
                Siirry sisältöön
            </a>

            {/* Header */}
            <header className="bg-gradient-to-r from-[#b30000] to-[#8b0000] text-white sticky top-0 z-50 shadow-lg">
                <div className="max-w-7xl mx-auto px-4 py-4">
                    <div className="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
                        <h1 className="text-xl lg:text-2xl font-bold">
                            <button onClick={() => setCurrentPage('home')} className="hover:opacity-80 transition-opacity">
                                Bollywoodin Taikaa
                            </button>
                        </h1>

                        <nav className="flex flex-wrap gap-2" aria-label="Päävalikko">
                            {navItems.map(item => (
                                <button
                                    key={item.id}
                                    onClick={() => setCurrentPage(item.id)}
                                    className={`px-4 py-2 rounded-lg font-semibold transition-all duration-200 ${
                                        currentPage === item.id 
                                            ? 'bg-white/20 transform -translate-y-0.5' 
                                            : 'hover:bg-white/10 hover:-translate-y-0.5'
                                    }`}
                                    aria-current={currentPage === item.id ? 'page' : undefined}
                                >
                                    {item.label}
                                </button>
                            ))}
                        </nav>
                        <div className="flex items-center gap-3 text-sm">
                            <span className="hidden sm:inline text-white/70">Sivuja:</span>
                            <div className="flex gap-1">
                                {navItems.map(item => (
                                    <span
                                        key={item.id}
                                        className={`w-2 h-2 rounded-full transition-all ${
                                            currentPage === item.id ? 'bg-white w-6' : 'bg-white/40'
                                        }`}
                                        aria-hidden="true"
                                    />
                                ))}
                            </div>
                        </div>

                        <button
                            onClick={() => setDarkMode(!darkMode)}
                            className="flex items-center gap-2 px-4 py-2 rounded-lg border border-white/20 hover:bg-white/10 transition-colors self-start lg:self-auto"
                            aria-label={darkMode ? 'Vaihda vaaleaan tilaan' : 'Vaihda tummaan tilaan'}
                        >
                            {darkMode ? <Sun className="w-4 h-4" /> : <Moon className="w-4 h-4" />}
                            <span className="text-sm">{darkMode ? 'Vaalea' : 'Tumma'}</span>
                        </button>
                    </div>
                </div>
            </header>

            {/* Main Content */}
            <main id="main" className="max-w-7xl mx-auto px-4 py-8" tabIndex={-1}>
                
                {/* Home Page */}
                {currentPage === 'home' && (
                    <section aria-labelledby="hero-title">
                        <h2 id="hero-title" className="text-3xl lg:text-4xl font-bold text-[#b30000] mb-4 border-b-4 border-[#d4af37] inline-block pb-2">
                            Tervetuloa Bollywoodin Taikaan
                        </h2>
                        <p className={`text-lg mb-8 ${darkMode ? 'text-[#9aa6b2]' : 'text-[#666]'}`}>
                            Värikästä draamaa, musiikkia ja ikonisia näyttelijöitä — selaa sivuja tai katso suosituimmat elokuvat.
                        </p>
                        
                        <figure className={`rounded-xl overflow-hidden shadow-2xl ${darkMode ? 'bg-[#121416]' : 'bg-white'}`}>
                            <img 
                                src="https://images.unsplash.com/photo-1524492412937-b28074a5d7da?w=1200&h=500&fit=crop" 
                                alt="Bollywood-kollaasi" 
                                className="w-full h-64 lg:h-96 object-cover"
                            />
                            <figcaption className="bg-[#b30000]/90 text-white p-4 text-center italic">
                                Bollywood — väriä, musiikkia, draamaa.
                            </figcaption>
                        </figure>

                        {/* Quick Stats */}
                        <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 mt-8">
                            {[
                                { num: `${movies.length}+`, label: 'Elokuvaa' },
                                { num: `${stars.length}+`, label: 'Tähteä' },
                                { num: `${directors.length}+`, label: 'Ohjaajaa' },
                                { num: `${musicians.length}+`, label: 'Muusikkoa' },
                            ].map((stat, i) => (
                                <div key={i} className={`p-6 rounded-xl text-center ${darkMode ? 'bg-[#121416]' : 'bg-white'} shadow-lg hover:shadow-xl transition-shadow`}>
                                    <div className="text-3xl font-bold text-[#b30000]">{stat.num}</div>
                                    <div className={darkMode ? 'text-[#9aa6b2]' : 'text-[#666]'}>{stat.label}</div>
                                </div>
                            ))}
                        </div>
                    </section>
                )}

                {/* Movies Page */}
                {currentPage === 'movies' && (
                    <section aria-labelledby="movies-title">
                        <h2 id="movies-title" className="text-3xl font-bold text-[#b30000] mb-4 border-b-4 border-[#d4af37] inline-block pb-2">
                            Top Elokuvat
                        </h2>
                        
                        <div className="relative mb-6">
                            <Search className="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400" />
                            <input
                                type="text"
                                placeholder="Hae elokuvia..."
                                value={movieSearch}
                                onChange={(e) => setMovieSearch(e.target.value)}
                                className={`w-full max-w-md pl-10 pr-4 py-3 rounded-xl border ${
                                    darkMode 
                                        ? 'bg-[#121416] border-gray-700 text-white placeholder-gray-500' 
                                        : 'bg-white border-gray-300 text-gray-900 placeholder-gray-400'
                                } focus:outline-none focus:ring-2 focus:ring-[#b30000]/30`}
                                aria-label="Hae elokuvia"
                            />
                        </div>

                        <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4" aria-live="polite" aria-label="Elokuvalista">
                            {filteredMovies.map((movie, i) => (
                                <article 
                                    key={i} 
                                    className={`rounded-xl overflow-hidden shadow-lg hover:shadow-2xl hover:-translate-y-2 transition-all duration-300 ${
                                        darkMode ? 'bg-[#121416]' : 'bg-white'
                                    }`}
                                >
                                    <img 
                                        src={movie.img} 
                                        alt={`${movie.title} juliste`} 
                                        className="w-full h-64 object-cover"
                                        loading="lazy"
                                        onError={(e) => {
                                            e.currentTarget.src = 'https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=300&h=450&fit=crop';
                                        }}
                                    />
                                    <h3 className="p-3 font-bold text-sm">{movie.title}</h3>
                                    <p className={`px-3 pb-4 text-xs ${darkMode ? 'text-[#9aa6b2]' : 'text-[#666]'}`}>
                                        {movie.meta}
                                    </p>
                                </article>
                            ))}
                        </div>
                        
                        {filteredMovies.length === 0 && (
                            <p className={`text-center py-12 ${darkMode ? 'text-[#9aa6b2]' : 'text-[#666]'}`}>
                                Ei löytynyt elokuvia hakusanalla "{movieSearch}"
                            </p>
                        )}
                    </section>
                )}

                {/* Stars Page */}
                {currentPage === 'stars' && (
                    <section aria-labelledby="stars-title">
                        <h2 id="stars-title" className="text-3xl font-bold text-[#b30000] mb-2 border-b-4 border-[#d4af37] inline-block pb-2">
                            Tähdet
                        </h2>
                        <p className={`mb-6 ${darkMode ? 'text-[#9aa6b2]' : 'text-[#666]'}`}>
                            Isoimmat näyttelijät ja lyhyet esittelyt.
                        </p>
                        
                        <div className="relative mb-6">
                            <Search className="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400" />
                            <input
                                type="text"
                                placeholder="Hae tähtiä..."
                                value={starSearch}
                                onChange={(e) => setStarSearch(e.target.value)}
                                className={`w-full max-w-md pl-10 pr-4 py-3 rounded-xl border ${
                                    darkMode 
                                        ? 'bg-[#121416] border-gray-700 text-white placeholder-gray-500' 
                                        : 'bg-white border-gray-300 text-gray-900 placeholder-gray-400'
                                } focus:outline-none focus:ring-2 focus:ring-[#b30000]/30`}
                                aria-label="Hae tähtiä"
                            />
                        </div>

                        <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4" aria-live="polite" aria-label="Tähtilista">
                            {filteredStars.map((star, i) => (
                                <article 
                                    key={i} 
                                    className={`rounded-xl overflow-hidden shadow-lg hover:shadow-2xl hover:-translate-y-2 transition-all duration-300 ${
                                        darkMode ? 'bg-[#121416]' : 'bg-white'
                                    }`}
                                >
                                    <img 
                                        src={star.img} 
                                        alt={star.name} 
                                        className="w-full h-56 object-cover object-top"
                                        loading="lazy"
                                        onError={(e) => {
                                            e.currentTarget.src = 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=300&h=350&fit=crop';
                                        }}
                                    />
                                    <h3 className="p-3 font-bold text-[#b30000]">{star.name}</h3>
                                    <p className={`px-3 pb-4 text-sm ${darkMode ? 'text-[#9aa6b2]' : 'text-[#666]'}`}>
                                        {star.desc}
                                    </p>
                                </article>
                            ))}
                        </div>
                        
                        {filteredStars.length === 0 && (
                            <p className={`text-center py-12 ${darkMode ? 'text-[#9aa6b2]' : 'text-[#666]'}`}>
                                Ei löytynyt tähtiä hakusanalla "{starSearch}"
                            </p>
                        )}
                    </section>
                )}

                {/* Directors Page */}
                {currentPage === 'directors' && (
                    <section aria-labelledby="directors-title">
                        <h2 id="directors-title" className="text-3xl font-bold text-[#b30000] mb-6 border-b-4 border-[#d4af37] inline-block pb-2">
                            Ohjaajat
                        </h2>

                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                            {directors.map((director, i) => (
                                <article 
                                    key={i} 
                                    className={`p-6 rounded-xl border-l-4 border-[#d4af37] shadow-lg hover:translate-x-1 hover:shadow-xl transition-all duration-300 ${
                                        darkMode ? 'bg-[#121416]' : 'bg-gradient-to-r from-white to-gray-50'
                                    }`}
                                >
                                    <h3 className="text-xl font-bold text-[#b30000] mb-2">{director.name}</h3>
                                    <p className={darkMode ? 'text-[#9aa6b2]' : 'text-[#666]'}>{director.desc}</p>
                                </article>
                            ))}
                        </div>
                    </section>
                )}

                {/* Music Page */}
                {currentPage === 'music' && (
                    <section aria-labelledby="music-title">
                        <h2 id="music-title" className="text-3xl font-bold text-[#b30000] mb-6 border-b-4 border-[#d4af37] inline-block pb-2">
                            Musiikki
                        </h2>

                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                            {musicians.map((musician, i) => (
                                <article 
                                    key={i} 
                                    className={`p-5 rounded-xl border-l-4 border-[#d4af37] shadow-lg hover:translate-x-1 hover:shadow-xl transition-all duration-300 ${
                                        darkMode ? 'bg-[#121416]' : 'bg-gradient-to-r from-white to-gray-50'
                                    }`}
                                >
                                    <h3 className="text-lg font-bold text-[#b30000] mb-1">{musician.name}</h3>
                                    <p className="text-[#d4af37] font-semibold text-xs uppercase tracking-wide mb-2">
                                        {musician.role}
                                    </p>
                                    <p className={`text-sm ${darkMode ? 'text-[#9aa6b2]' : 'text-[#666]'}`}>
                                        {musician.desc}
                                    </p>
                                </article>
                            ))}
                        </div>
                    </section>
                )}
            </main>

            {/* Footer */}
            <footer className="bg-[#222] text-white py-6 mt-12">
                <div className="max-w-7xl mx-auto px-4 text-center">
                    <p>&copy; 2025 Bollywoodin Taikaa — Kaikki oikeudet pidätetään.</p>
                </div>
            </footer>
        </div>
    );
}

        ReactDOM.render(<BollywoodWebsite />, document.getElementById('root'));
    </script>
</body>
</html>
